apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuerName | quote }}
spec:
  acme:
    server: {{ .Values.acmeServer | quote }}
    privateKeySecretRef:
      name: {{ printf "%s-account" .Values.issuerName | quote }}
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
